name: Build a preview version for Android
on:
  push:
    paths:
      - '.github/workflows/build-preview-android.yml'
      - 'android/**'
      - 'android-hidden-api/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Cache FFmpeg Builds
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: android/libs/ffmpeg/build
          key: ffmpeg-9.0.1-ndk26.1.10909125-${{ hashFiles('android/libs/ffmpeg/scripts/**') }}

      - name: Fetch FFmpeg Source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: pwsh ./android/libs/ffmpeg/scripts/fetch.ps1

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)" "ndk;26.1.10909125"
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" bash ./android/libs/ffmpeg/scripts/build.sh

      - name: Build Application
        run: |
          chmod +x ./gradlew
          ./gradlew android:build

          LINT_RESULTS=$(cat android/build/reports/lint-results-debug.txt)
          echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "$LINT_RESULTS" >> $GITHUB_STEP_SUMMARY

      - name: Setup Artifact Client
        uses: lhotari/gh-actions-artifact-client@v2

      - name: Upload Artifacts
        shell: bash
        run: |
          mkdir dist

          for file in android/build/outputs/apk/preview/*.apk; do
            [ -e "$file" ] || continue
            name=$(basename "$file")
            name="${name/#android-/drsticker-}"
            name="${name//-unsigned/}"
            cp "$file" "dist/$name"
          done

          cp android/build/outputs/mapping/preview/mapping.txt dist/

          file_hash=$(git rev-parse --short HEAD)
          find "dist" -maxdepth 1 -type f | while read -r file; do
            full_name=$(basename "$file")
            artifact_name="${full_name%.*}-${file_hash}"
            echo "Uploading: $full_name"
            zip -q -j - "$file" | gh-actions-artifact-client.js upload "${artifact_name}"
          done
